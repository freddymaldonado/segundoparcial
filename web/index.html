<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guardrails para Vibe Coding - Grupo 3</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f1f5f9;
        --ink: #0f172a;
        --muted: #64748b;
        --card: #ffffff;
        --line: #e2e8f0;
        --brand: #2563eb;
        --crit: #dc2626;
        --alta: #ea580c;
        --media: #ca8a04;
        --baja: #16a34a;
        --deps: #7c3aed;
        --code-bg: #0d1117;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg); color: var(--ink); margin: 0;
        padding: 2rem 1rem; line-height: 1.55;
      }
      .wrap { max-width: 1040px; margin: 0 auto; }
      header {
        background: linear-gradient(135deg, #0f172a, #1e3a8a); color: #fff;
        padding: 1.9rem 2rem; border-radius: 18px; margin-bottom: 1.5rem;
        box-shadow: 0 10px 30px -12px rgba(15, 23, 42, .5);
      }
      header h1 { margin: 0 0 .35rem; font-size: 1.6rem; }
      header p { margin: 0; opacity: .85; font-size: .95rem; }

      #dropzone {
        border: 2.5px dashed #94a3b8; border-radius: 16px; background: var(--card);
        padding: 2.5rem 1.5rem; text-align: center; cursor: pointer;
        transition: border-color .15s, background .15s, transform .15s; margin-bottom: 1rem;
      }
      #dropzone:hover { transform: translateY(-2px); }
      #dropzone.drag { border-color: var(--brand); background: #eff6ff; }
      #dropzone .icon { font-size: 2.4rem; }
      #dropzone h2 { margin: .5rem 0 .25rem; font-size: 1.1rem; }
      #dropzone p { margin: 0; color: var(--muted); font-size: .9rem; }

      #filelist { list-style: none; padding: 0; margin: 0 0 1rem; }
      #filelist li {
        display: flex; align-items: center; justify-content: space-between;
        background: var(--card); border: 1px solid var(--line); border-radius: 10px;
        padding: .6rem .9rem; margin-bottom: .5rem; font-size: .9rem;
      }
      #filelist .name { font-family: ui-monospace, monospace; }
      #filelist .rm {
        border: none; background: #fee2e2; color: #b91c1c; cursor: pointer;
        border-radius: 6px; padding: .2rem .55rem; font-weight: 700;
      }
      .actions { display: flex; gap: .75rem; align-items: center; margin-bottom: 1.5rem; }
      button.scan {
        background: var(--brand); color: #fff; border: none; border-radius: 10px;
        padding: .8rem 1.6rem; font-size: 1rem; font-weight: 700; cursor: pointer;
        transition: filter .15s;
      }
      button.scan:hover:not(:disabled) { filter: brightness(1.08); }
      button.scan:disabled { background: #94a3b8; cursor: not-allowed; }
      button.ghost {
        background: transparent; border: 1px solid var(--line); color: var(--muted);
        border-radius: 10px; padding: .8rem 1rem; cursor: pointer;
      }
      .status { color: var(--muted); font-size: .9rem; }

      /* Progreso por archivo */
      .progress { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
                  padding: 1.1rem 1.3rem; margin-bottom: 1.5rem; }
      .progress-head { display: flex; justify-content: space-between; align-items: center;
                       font-size: .9rem; margin-bottom: .6rem; }
      .progress-head #progress-label { font-weight: 700; color: var(--ink); }
      .progress-head #progress-count { color: var(--muted); font-variant-numeric: tabular-nums; }
      .progress-track { height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
      .progress-bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--brand), #38bdf8);
                      border-radius: 999px; transition: width .35s ease; }
      #progress-list { list-style: none; padding: 0; margin: .9rem 0 0; display: grid; gap: .4rem; }
      #progress-list li { display: flex; align-items: center; gap: .6rem; font-size: .88rem;
                          padding: .45rem .7rem; border-radius: 9px; background: var(--bg); }
      #progress-list .pname { font-family: ui-monospace, monospace; flex: 1; word-break: break-all; }
      #progress-list .pstate { font-size: .78rem; font-weight: 700; }
      #progress-list li.pending  { opacity: .6; }
      #progress-list li.running  { box-shadow: inset 3px 0 0 var(--brand); }
      #progress-list li.done     { box-shadow: inset 3px 0 0 var(--baja); }
      #progress-list li.failed   { box-shadow: inset 3px 0 0 var(--crit); }
      #progress-list .ico { width: 16px; height: 16px; flex-shrink: 0; }
      #progress-list .done .pstate    { color: var(--baja); }
      #progress-list .failed .pstate  { color: var(--crit); }
      #progress-list .running .pstate { color: var(--brand); }
      #progress-list .pending .pstate { color: var(--muted); }

      .metrics { display: grid; grid-template-columns: repeat(6, 1fr); gap: .75rem; margin: 1.5rem 0; }
      .metric { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .9rem; text-align: center; }
      .metric .n { font-size: 1.7rem; font-weight: 800; }
      .metric .l { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
      .metric.total .n { color: var(--ink); }
      .metric.crit .n { color: var(--crit); }
      .metric.alta .n { color: var(--alta); }
      .metric.media .n { color: var(--media); }
      .metric.baja .n { color: var(--baja); }
      .metric.deps .n { color: var(--deps); }

      /* Tarjetas por archivo */
      .section-title { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
                       color: var(--muted); margin: 1.8rem 0 .8rem; font-weight: 700; }
      .cards-head { display: flex; align-items: center; justify-content: space-between;
                    gap: 1rem; flex-wrap: wrap; }
      .cards-head .section-title { margin: 1.8rem 0 .8rem; }
      .download { background: #0f172a; color: #fff; border: none; border-radius: 10px;
                  padding: .6rem 1.1rem; font-size: .85rem; font-weight: 700; cursor: pointer;
                  transition: filter .15s; }
      .download:hover:not(:disabled) { filter: brightness(1.25); }
      .download:disabled { opacity: .5; cursor: not-allowed; }
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
      .filecard {
        background: var(--card); border: 1px solid var(--line); border-radius: 14px;
        padding: 1.2rem 1.3rem; cursor: pointer; text-align: left;
        transition: transform .15s, box-shadow .15s, border-color .15s;
      }
      .filecard:hover { transform: translateY(-3px); box-shadow: 0 12px 24px -16px rgba(15,23,42,.45); border-color: var(--brand); }
      .filecard .top { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
      .filecard .fname { font-family: ui-monospace, monospace; font-weight: 700; font-size: 1rem;
                         word-break: break-all; }
      .filecard .lang { font-size: .68rem; text-transform: uppercase; letter-spacing: .05em;
                        background: #eef2ff; color: var(--brand); padding: .15rem .5rem;
                        border-radius: 999px; font-weight: 700; flex-shrink: 0; }
      .filecard .resumen { color: var(--muted); font-size: .85rem; margin: .6rem 0 .9rem;
                           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .chips { display: flex; gap: .4rem; flex-wrap: wrap; }
      .chip { font-size: .72rem; font-weight: 800; padding: .2rem .55rem; border-radius: 999px; color: #fff; }
      .chip.CRITICA { background: var(--crit); }
      .chip.ALTA { background: var(--alta); }
      .chip.MEDIA { background: var(--media); }
      .chip.BAJA { background: var(--baja); }
      .chip.deps { background: var(--deps); }
      .chip.clean { background: var(--baja); }
      .filecard .open { margin-top: .9rem; color: var(--brand); font-size: .82rem; font-weight: 700; }

      /* Modal / visor */
      .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.55); backdrop-filter: blur(3px);
                 display: none; align-items: flex-start; justify-content: center; padding: 3vh 2vw; z-index: 50; }
      .overlay.open { display: flex; }
      .modal { background: var(--bg); width: min(1100px, 100%); max-height: 94vh; border-radius: 18px;
               display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6);
               animation: rise .25s ease; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; } }
      .modal-head { background: linear-gradient(135deg, #0f172a, #1e3a8a); color: #fff;
                    padding: 1.2rem 1.5rem; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
      .modal-head .fname { font-family: ui-monospace, monospace; font-weight: 800; font-size: 1.15rem; word-break: break-all; }
      .modal-head .meta { opacity: .85; font-size: .85rem; margin-top: .3rem; }
      .modal-head .chips { margin-top: .6rem; }
      .modal-head .close { background: rgba(255,255,255,.15); border: none; color: #fff; width: 34px; height: 34px;
                           border-radius: 9px; cursor: pointer; font-size: 1.2rem; flex-shrink: 0; }
      .modal-body { overflow: auto; padding: 1.3rem 1.5rem; }
      .modal-resumen { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--brand);
                       border-radius: 0 10px 10px 0; padding: .9rem 1.1rem; margin-bottom: 1.2rem; font-style: italic; color: #334155; }

      /* Code viewer estilo IDE */
      .codeview { background: var(--code-bg); border-radius: 12px; overflow: hidden; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                  font-size: .85rem; border: 1px solid #1f2937; }
      .code-row { display: grid; grid-template-columns: 52px 1fr; align-items: start; }
      .code-row .ln { text-align: right; padding: .05rem .8rem .05rem 0; color: #6b7280; user-select: none;
                      border-right: 1px solid #1f2937; }
      .code-row .lc { padding: .05rem 1rem; white-space: pre; overflow-x: auto; color: #e6edf3; }
      .code-row.flagged .lc { box-shadow: inset 3px 0 0 var(--sev); }
      .code-row.flagged.CRITICA { --sev: var(--crit); background: rgba(220,38,38,.16); }
      .code-row.flagged.ALTA    { --sev: var(--alta); background: rgba(234,88,12,.15); }
      .code-row.flagged.MEDIA   { --sev: var(--media); background: rgba(202,138,4,.16); }
      .code-row.flagged.BAJA    { --sev: var(--baja); background: rgba(22,163,74,.15); }
      .code-row.flagged .ln { color: #cbd5e1; font-weight: 700; }

      .annot { grid-column: 1 / -1; background: #0b1220; border-top: 1px dashed #334155; padding: .9rem 1.1rem 1rem 60px; }
      .annot .a-head { display: flex; align-items: center; gap: .5rem; margin-bottom: .45rem; flex-wrap: wrap; }
      .annot .badge { color: #fff; padding: .14rem .55rem; border-radius: 999px; font-size: .68rem; font-weight: 800; }
      .annot .badge.CRITICA { background: var(--crit); }
      .annot .badge.ALTA { background: var(--alta); }
      .annot .badge.MEDIA { background: var(--media); }
      .annot .badge.BAJA { background: var(--baja); }
      .annot .a-title { color: #f8fafc; font-weight: 700; font-size: .9rem; }
      .annot .cwe { color: #94a3b8; font-size: .72rem; font-family: ui-monospace, monospace; }
      .annot .a-field { color: #cbd5e1; font-size: .83rem; margin: .35rem 0; }
      .annot .a-field b { color: #93c5fd; }
      .annot .fix { background: #06210f; border: 1px solid #14532d; border-radius: 8px; padding: .5rem .7rem; margin-top: .4rem; color: #e2e8f0; font-size: .83rem; white-space: pre-wrap; word-break: break-word; }
      .annot .fix b { color: #4ade80; }
      .annot code { background: #1f2937; color: #e6edf3; padding: .1rem .4rem; border-radius: 4px; font-size: .8rem; }

      .extra { margin-top: 1.4rem; display: grid; gap: 1rem; }
      .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.2rem; }
      .panel h4 { margin: 0 0 .5rem; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
      .panel ul { margin: 0; padding-left: 1.2rem; }
      .panel li { font-size: .88rem; margin: .25rem 0; }
      .panel.deps { border-left: 4px solid var(--deps); }
      .panel.human { border-left: 4px solid var(--media); }

      .hidden { display: none; }
      .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #cbd5e1; border-top-color: var(--brand);
                 border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; margin-right: .4rem; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Guardrails para Vibe Coding</h1>
        <p>Grupo 3 &middot; Auditor de codigo generado por IA &middot; Servidor MCP + LLM</p>
      </header>

      <div id="dropzone">
        <div class="icon">&#128228;</div>
        <h2>Arrastra aqui tus archivos</h2>
        <p>Cualquier tipo de archivo &middot; o haz clic para elegir</p>
        <input id="fileinput" type="file" multiple class="hidden" />
      </div>

      <ul id="filelist"></ul>

      <div class="actions">
        <button id="scanbtn" class="scan" disabled>Escanear</button>
        <button id="clearbtn" class="ghost hidden">Limpiar</button>
        <span id="status" class="status"></span>
      </div>

      <section id="progress" class="progress hidden">
        <div class="progress-head">
          <span id="progress-label">Analizando...</span>
          <span id="progress-count">0 / 0</span>
        </div>
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        <ul id="progress-list"></ul>
      </section>

      <section id="metrics" class="metrics hidden"></section>
      <div id="cards-head" class="cards-head hidden">
        <span class="section-title">Reportes por archivo &middot; clic para ver el detalle</span>
        <button id="downloadbtn" class="download">&#11015; Descargar reporte .md</button>
      </div>
      <section id="cards" class="cards"></section>
    </div>

    <div id="overlay" class="overlay">
      <div class="modal" id="modal"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
      const dropzone = document.getElementById("dropzone");
      const fileinput = document.getElementById("fileinput");
      const filelist = document.getElementById("filelist");
      const scanbtn = document.getElementById("scanbtn");
      const clearbtn = document.getElementById("clearbtn");
      const statusEl = document.getElementById("status");
      const metricsEl = document.getElementById("metrics");
      const cardsEl = document.getElementById("cards");
      const cardsHead = document.getElementById("cards-head");
      const downloadbtn = document.getElementById("downloadbtn");
      const overlay = document.getElementById("overlay");
      const modal = document.getElementById("modal");
      const progressEl = document.getElementById("progress");
      const progressBar = document.getElementById("progress-bar");
      const progressCount = document.getElementById("progress-count");
      const progressLabel = document.getElementById("progress-label");
      const progressList = document.getElementById("progress-list");

      const SEVERITIES = ["CRITICA", "ALTA", "MEDIA", "BAJA"];
      const HLJS_LANG = {
        python: "python", javascript: "javascript", typescript: "typescript",
        java: "java", go: "go", ruby: "ruby", php: "php", c: "c", cpp: "cpp",
        csharp: "csharp", rust: "rust", bash: "bash", sql: "sql", html: "xml",
        yaml: "yaml", json: "json",
      };

      let files = [];
      let lastResults = [];

      function esc(s) {
        return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function firstLine(linea) {
        const m = String(linea ?? "").match(/\d+/);
        return m ? parseInt(m[0], 10) : null;
      }

      function refreshList() {
        filelist.innerHTML = files
          .map(
            (f, i) =>
              `<li><span class="name">${esc(f.name)}</span>
               <button class="rm" data-i="${i}">&times;</button></li>`
          )
          .join("");
        scanbtn.disabled = files.length === 0;
        clearbtn.classList.toggle("hidden", files.length === 0);
      }
      function addFiles(list) {
        for (const f of list) {
          if (!files.some((x) => x.name === f.name)) files.push(f);
        }
        refreshList();
      }

      dropzone.addEventListener("click", () => fileinput.click());
      fileinput.addEventListener("change", (e) => addFiles(e.target.files));
      ["dragover", "dragenter"].forEach((ev) =>
        dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.add("drag"); })
      );
      ["dragleave", "drop"].forEach((ev) =>
        dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.remove("drag"); })
      );
      dropzone.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));
      filelist.addEventListener("click", (e) => {
        if (e.target.classList.contains("rm")) {
          files.splice(Number(e.target.dataset.i), 1);
          refreshList();
        }
      });
      clearbtn.addEventListener("click", () => {
        files = [];
        lastResults = [];
        refreshList();
        metricsEl.classList.add("hidden");
        metricsEl.innerHTML = "";
        cardsEl.innerHTML = "";
        cardsHead.classList.add("hidden");
        progressEl.classList.add("hidden");
        progressList.innerHTML = "";
        statusEl.textContent = "";
      });

      const EMPTY_SUMMARY = () => ({
        archivos: 0, total: 0,
        por_severidad: { CRITICA: 0, ALTA: 0, MEDIA: 0, BAJA: 0 },
        dependencias_sospechosas: 0,
      });

      function mergeSummary(acc, s) {
        acc.archivos += s.archivos || 0;
        acc.total += s.total || 0;
        acc.dependencias_sospechosas += s.dependencias_sospechosas || 0;
        SEVERITIES.forEach((k) => { acc.por_severidad[k] += (s.por_severidad?.[k]) || 0; });
        return acc;
      }

      function initProgress() {
        progressList.innerHTML = files
          .map(
            (f, i) =>
              `<li class="pending" data-i="${i}">
                 <span class="ico"></span>
                 <span class="pname">${esc(f.name)}</span>
                 <span class="pstate">En cola</span>
               </li>`
          )
          .join("");
        progressBar.style.width = "0%";
        progressCount.textContent = `0 / ${files.length}`;
        progressLabel.textContent = "Analizando archivos...";
        progressEl.classList.remove("hidden");
      }

      function setFileState(i, state, label) {
        const li = progressList.querySelector(`li[data-i="${i}"]`);
        if (!li) return;
        li.className = state;
        const ico = li.querySelector(".ico");
        ico.innerHTML = state === "running" ? `<span class="spinner"></span>` : "";
        li.querySelector(".pstate").textContent = label;
      }

      scanbtn.addEventListener("click", async () => {
        scanbtn.disabled = true;
        clearbtn.disabled = true;
        statusEl.innerHTML = `<span class="spinner"></span>Analizando...`;
        metricsEl.classList.add("hidden");
        cardsEl.innerHTML = "";
        cardsHead.classList.add("hidden");
        lastResults = [];
        initProgress();

        const summary = EMPTY_SUMMARY();
        const total = files.length;
        let done = 0;
        let errores = 0;

        for (let i = 0; i < files.length; i++) {
          const f = files[i];
          setFileState(i, "running", "Analizando...");
          progressLabel.textContent = `Analizando ${f.name}`;
          try {
            const fd = new FormData();
            fd.append("files", f);
            const res = await fetch("/api/scan", { method: "POST", body: fd });
            if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
            const data = await res.json();
            mergeSummary(summary, data.summary);
            lastResults.push(...data.results);
            const n = data.results[0]?.audit?.hallazgos?.length ?? 0;
            setFileState(i, "done", n ? `${n} hallazgos` : "Sin hallazgos");
          } catch (err) {
            errores++;
            setFileState(i, "failed", "Error");
          } finally {
            done++;
            progressCount.textContent = `${done} / ${total}`;
            progressBar.style.width = `${(done / total) * 100}%`;
            renderMetrics(summary);
            renderCards(lastResults);
          }
        }

        progressLabel.textContent = errores
          ? `Completado con ${errores} error(es)`
          : "Analisis completado";
        statusEl.textContent = errores ? `Listo (${errores} con error).` : "Listo.";
        scanbtn.disabled = files.length === 0;
        clearbtn.disabled = false;
      });

      function renderMetrics(s) {
        const sev = s.por_severidad;
        metricsEl.innerHTML = `
          <div class="metric total"><div class="n">${s.total}</div><div class="l">Total</div></div>
          <div class="metric crit"><div class="n">${sev.CRITICA}</div><div class="l">Critica</div></div>
          <div class="metric alta"><div class="n">${sev.ALTA}</div><div class="l">Alta</div></div>
          <div class="metric media"><div class="n">${sev.MEDIA}</div><div class="l">Media</div></div>
          <div class="metric baja"><div class="n">${sev.BAJA}</div><div class="l">Baja</div></div>
          <div class="metric deps"><div class="n">${s.dependencias_sospechosas}</div><div class="l">Deps</div></div>`;
        metricsEl.classList.remove("hidden");
      }

      function severityCounts(audit) {
        const c = { CRITICA: 0, ALTA: 0, MEDIA: 0, BAJA: 0 };
        (audit.hallazgos || []).forEach((h) => { if (c[h.severidad] != null) c[h.severidad]++; });
        return c;
      }

      function renderCards(results) {
        cardsEl.innerHTML = results
          .map((r, idx) => {
            const c = severityCounts(r.audit);
            const deps = (r.audit.dependencias_sospechosas || []).length;
            const total = (r.audit.hallazgos || []).length;
            const chips = SEVERITIES.filter((s) => c[s] > 0)
              .map((s) => `<span class="chip ${s}">${c[s]} ${s}</span>`)
              .join("");
            const depChip = deps ? `<span class="chip deps">${deps} deps</span>` : "";
            const cleanChip = total === 0 && !deps ? `<span class="chip clean">Sin hallazgos</span>` : "";
            return `<article class="filecard" data-i="${idx}">
              <div class="top">
                <span class="fname">${esc(r.filename)}</span>
                <span class="lang">${esc(r.language || "texto")}</span>
              </div>
              <p class="resumen">${esc(r.audit.resumen)}</p>
              <div class="chips">${chips}${depChip}${cleanChip}</div>
              <div class="open">Ver reporte &rarr;</div>
            </article>`;
          })
          .join("");
        cardsHead.classList.toggle("hidden", results.length === 0);
        downloadbtn.disabled = results.length === 0;
      }

      cardsEl.addEventListener("click", (e) => {
        const card = e.target.closest(".filecard");
        if (card) openModal(Number(card.dataset.i));
      });

      // Divide el HTML resaltado por highlight.js en lineas preservando los spans abiertos.
      function splitHighlightedLines(html) {
        const lines = [];
        const open = [];
        let buf = "";
        const re = /(<span\b[^>]*>)|(<\/span>)|(\n)|([^<\n]+)|(<)/g;
        const start = () => { buf = open.join(""); };
        start();
        let m;
        while ((m = re.exec(html)) !== null) {
          if (m[1]) { open.push(m[1]); buf += m[1]; }
          else if (m[2]) { open.pop(); buf += "</span>"; }
          else if (m[3]) { buf += "</span>".repeat(open.length); lines.push(buf); start(); }
          else { buf += m[0]; }
        }
        buf += "</span>".repeat(open.length);
        lines.push(buf);
        return lines;
      }

      function highlightLines(code, language) {
        const lang = HLJS_LANG[language];
        let html;
        try {
          html = lang
            ? hljs.highlight(code, { language: lang }).value
            : hljs.highlightAuto(code).value;
        } catch (err) {
          html = esc(code);
        }
        return splitHighlightedLines(html);
      }

      function annotation(h) {
        const sev = SEVERITIES.includes(h.severidad) ? h.severidad : "BAJA";
        return `<div class="annot">
          <div class="a-head">
            <span class="badge ${sev}">${esc(h.severidad)}</span>
            <span class="a-title">${esc(h.titulo)}</span>
            <span class="cwe">${esc(h.cwe || "")}</span>
          </div>
          ${h.evidencia ? `<div class="a-field"><b>Evidencia:</b> <code>${esc(h.evidencia)}</code></div>` : ""}
          <div class="a-field"><b>Riesgo:</b> ${esc(h.explicacion)}</div>
          <div class="fix"><b>Sugerencias:</b> ${esc(h.reescritura_segura)}</div>
        </div>`;
      }

      function openModal(idx) {
        const r = lastResults[idx];
        if (!r) return;
        const a = r.audit;
        const c = severityCounts(a);
        const chips = SEVERITIES.filter((s) => c[s] > 0)
          .map((s) => `<span class="chip ${s}">${c[s]} ${s}</span>`)
          .join("");

        const byLine = {};
        (a.hallazgos || []).forEach((h) => {
          const ln = firstLine(h.linea);
          if (ln != null) (byLine[ln] = byLine[ln] || []).push(h);
        });

        const codeLines = highlightLines(r.code || "", r.language);
        const codeHtml = codeLines
          .map((html, i) => {
            const ln = i + 1;
            const hs = byLine[ln];
            const sev = hs
              ? (hs.find((h) => h.severidad === "CRITICA") ? "CRITICA"
                : hs.find((h) => h.severidad === "ALTA") ? "ALTA"
                : hs.find((h) => h.severidad === "MEDIA") ? "MEDIA" : "BAJA")
              : "";
            const rowCls = hs ? `code-row flagged ${sev}` : "code-row";
            const annots = hs ? hs.map(annotation).join("") : "";
            return `<div class="${rowCls}"><div class="ln">${ln}</div><div class="lc">${html || "&nbsp;"}</div></div>${annots}`;
          })
          .join("");

        const orphan = (a.hallazgos || []).filter((h) => firstLine(h.linea) == null);
        const deps = (a.dependencias_sospechosas || []).length
          ? `<div class="panel deps"><h4>Dependencias sospechosas</h4><ul>${a.dependencias_sospechosas
              .map((d) => `<li><code>${esc(d.paquete)}</code> &mdash; ${esc(d.motivo)}</li>`)
              .join("")}</ul></div>`
          : "";
        const human = (a.requiere_validacion_humana || []).length
          ? `<div class="panel human"><h4>Requiere validacion humana</h4><ul>${a.requiere_validacion_humana
              .map((p) => `<li>${esc(p)}</li>`)
              .join("")}</ul></div>`
          : "";
        const orphanPanel = orphan.length
          ? `<div class="panel"><h4>Hallazgos generales (sin linea)</h4>${orphan.map(annotation).join("")}</div>`
          : "";

        modal.innerHTML = `
          <div class="modal-head">
            <div>
              <div class="fname">${esc(r.filename)}</div>
              <div class="meta">${esc(r.language || "texto")} &middot; ${(a.hallazgos || []).length} hallazgos</div>
              <div class="chips">${chips || '<span class="chip clean">Sin hallazgos</span>'}</div>
            </div>
            <button class="close" id="closebtn">&times;</button>
          </div>
          <div class="modal-body">
            <div class="modal-resumen">${esc(a.resumen)}</div>
            <div class="codeview">${codeHtml}</div>
            <div class="extra">${orphanPanel}${deps}${human}</div>
          </div>`;
        overlay.classList.add("open");
        document.getElementById("closebtn").onclick = closeModal;
      }

      function closeModal() { overlay.classList.remove("open"); }
      overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

      downloadbtn.addEventListener("click", async () => {
        if (!lastResults.length) return;
        const original = downloadbtn.innerHTML;
        downloadbtn.disabled = true;
        downloadbtn.innerHTML = "Generando...";
        try {
          const res = await fetch("/api/report", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ results: lastResults }),
          });
          if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "reporte-guardrails.md";
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        } catch (err) {
          statusEl.textContent = "Error al generar el reporte: " + err.message;
        } finally {
          downloadbtn.innerHTML = original;
          downloadbtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
